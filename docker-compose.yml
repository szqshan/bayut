version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bayut-postgres
    environment:
      POSTGRES_USER: bayut
      POSTGRES_PASSWORD: bayut123
      POSTGRES_DB: bayut_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bayut"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bayut-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend service (commented out for now, will be used later)
  # backend:
  #   build: ./backend
  #   container_name: bayut-backend
  #   command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
  #   volumes:
  #     - ./backend:/app
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   env_file:
  #     - ./backend/.env

volumes:
  postgres_data:
  redis_data:
